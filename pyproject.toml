[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-cloud-managed-mlflow"
dynamic = ["version"]
description = "Google Cloud Managed Service for MLflow plugin"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Google LLC" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "mlflow>=3.17.2",
    "google-auth>=2.15.0",
    "google-cloud-storage>=2.14.0",
    "requests>=2.32.3",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "cryptography>=41.0.0",
    "mypy>=1.8.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "setuptools>=77.0.0",
    "twine>=6.1.0",
    "types-requests>=2.32.0",
    "wheel",
]

[project.urls]
Homepage = "https://github.com/GoogleCloudPlatform/google-cloud-managed-mlflow"
Repository = "https://github.com/GoogleCloudPlatform/google-cloud-managed-mlflow"
Issues = "https://github.com/GoogleCloudPlatform/google-cloud-managed-mlflow/issues"
Changelog = "https://github.com/GoogleCloudPlatform/google-cloud-managed-mlflow/releases"

[project.entry-points."mlflow.request_auth_provider"]
google-cloud-auth = "google_cloud_managed_mlflow.auth:GoogleCloudAuthProvider"

[project.entry-points."mlflow.tracking_store"]
https = "google_cloud_managed_mlflow.tracking_store:build_tracking_store"

[project.entry-points."mlflow.model_registry_store"]
https = "google_cloud_managed_mlflow.registry_store:build_registry_store"

[project.entry-points."mlflow.artifact_repository"]
gs = "google_cloud_managed_mlflow.gcs_artifact_repo:GcpGCSArtifactRepository"
models = "google_cloud_managed_mlflow.models_artifact_repo:GcpModelsArtifactRepository"

[tool.setuptools.packages.find]
where = ["."]
include = ["google_cloud_managed_mlflow*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
google_cloud_managed_mlflow = ["py.typed"]

# Must remain a literal in __init__.py so setuptools.config.expand.StaticModule
# extracts __version__ via AST without importing runtime deps in isolated builds.
[tool.setuptools.dynamic]
version = { attr = "google_cloud_managed_mlflow.__version__" }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
strict = true
files = ["google_cloud_managed_mlflow", "tests"]
exclude = ["^(build|dist)/"]
disallow_subclassing_any = false
untyped_calls_exclude = [
    "mlflow",
    "google.auth",
    "google.api_core",
    "google.cloud",
    "google.oauth2",
]

[[tool.mypy.overrides]]
module = ["mlflow.*", "google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyspark.*", "py4j.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
]
