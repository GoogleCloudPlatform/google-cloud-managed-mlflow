# GitHub repository rulesets restrict creation, update, and deletion across
# all tags (*) to maintainers. In-workflow origin/main ancestry and __version__
# parity assertions provide defense-in-depth against accidental tag triggers.
name: Release to PyPI via OSS Exit Gate

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  DIST_ARTIFACT_NAME: "python-package-distributions"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is on main
        run: |
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Error: Tagged commit $(git rev-parse HEAD) is not an ancestor of origin/main"
            exit 1
          fi

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Verify Git tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import google_cloud_managed_mlflow; print(google_cloud_managed_mlflow.__version__)")
          CANONICAL_VERSION=$(python -c "import sys; from packaging.version import Version; print(Version(sys.argv[1]))" "$PKG_VERSION")
          if [ "$PKG_VERSION" != "$CANONICAL_VERSION" ]; then
            echo "Error: Package __version__ '$PKG_VERSION' is not canonical PEP 440 ('$CANONICAL_VERSION')"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Tag version '$TAG_VERSION' does not match package __version__ '$PKG_VERSION'"
            exit 1
          fi

      - name: Run unit tests
        run: pytest -v

      - name: Build and check sdist and wheel
        run: |
          python -m build
          twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.DIST_ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # Required to mint OIDC token for OSS Exit Gate WIF
    env:
      EXIT_GATE_HOST_PROJECT: "oss-exit-gate-prod"
      EXIT_GATE_LOCATION: "us"
      EXIT_GATE_REPO: "cloud-managed-mlflow--pypi"
      EXIT_GATE_MANIFEST_PREFIX: "gs://oss-exit-gate-prod-projects-bucket/cloud-managed-mlflow/pypi/manifests"
      PYPI_PACKAGE: "google-cloud-managed-mlflow"
    steps:
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.DIST_ARTIFACT_NAME }}
          path: dist/

      - name: Verify downloaded artifacts
        run: |
          WHL_COUNT=$(find dist -maxdepth 1 -name "*.whl" | wc -l)
          SDIST_COUNT=$(find dist -maxdepth 1 -name "*.tar.gz" | wc -l)
          if [ "${WHL_COUNT}" -ne 1 ] || [ "${SDIST_COUNT}" -ne 1 ]; then
            echo "Expected exactly 1 .whl and 1 .tar.gz in dist/, found ${WHL_COUNT} wheels and ${SDIST_COUNT} sdists"
            exit 1
          fi

      # Inline wheel-only pins maintain a checkout-free publish job without running
      # third-party sdist build hooks (not scanned by Dependabot).
      # Keep twine aligned with pyproject.toml [project.optional-dependencies].dev;
      # keyring and keyrings.google-artifactregistry-auth are pinned exclusively here.
      - name: Install pinned publish dependencies
        run: |
          python -m pip install --no-cache-dir --only-binary=:all: \
            "twine==7.0.0" \
            "keyring==25.7.0" \
            "keyrings.google-artifactregistry-auth==1.1.2"

      - name: Authenticate with OSS Exit Gate GCP Project (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Clean up any prior staged version in Artifact Registry
        # Probes repository existence and IAM first because versions delete returns NOT_FOUND
        # indistinguishably for a missing repository, an uncreated package, or an absent version.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gcloud artifacts repositories describe "${EXIT_GATE_REPO}" \
            --project="${EXIT_GATE_HOST_PROJECT}" \
            --location="${EXIT_GATE_LOCATION}" >/dev/null

          DELETE_RC=0
          DELETE_OUT=$(gcloud artifacts versions delete "${VERSION}" \
            --package="${PYPI_PACKAGE}" \
            --project="${EXIT_GATE_HOST_PROJECT}" \
            --repository="${EXIT_GATE_REPO}" \
            --location="${EXIT_GATE_LOCATION}" \
            --quiet 2>&1) || DELETE_RC=$?

          if [ "${DELETE_RC}" -ne 0 ]; then
            if printf '%s\n' "${DELETE_OUT}" | grep -Eq '(^|[[:space:]:])NOT_FOUND([[:space:]:]|$)'; then
              echo "No prior staged version found for ${PYPI_PACKAGE} ${VERSION}; proceeding."
            else
              printf '%s\n' "${DELETE_OUT}" >&2
              exit "${DELETE_RC}"
            fi
          fi

      - name: Upload package to OSS Exit Gate Artifact Registry
        run: |
          twine upload \
            --repository-url "https://${EXIT_GATE_LOCATION}-python.pkg.dev/${EXIT_GATE_HOST_PROJECT}/${EXIT_GATE_REPO}" \
            --non-interactive \
            dist/*

      - name: Trigger OSS Exit Gate publishing
        # Names this tag's exact version so no other staged version in Artifact Registry is published.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_NAME="manifest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          MANIFEST_FILE="${RUNNER_TEMP}/${MANIFEST_NAME}"
          jq -n \
            --arg name "${PYPI_PACKAGE}" \
            --arg version "${VERSION}" \
            '{publish_all: false, publishing_groups: [{packages: [{name: $name, version: $version}]}]}' \
            > "${MANIFEST_FILE}"
          gcloud storage cp "${MANIFEST_FILE}" "${EXIT_GATE_MANIFEST_PREFIX}/${MANIFEST_NAME}"
